<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ForeignHokkaido</title>

    <!-- Favicon adapted from "Hokkaido" by Snow, from Noun Project (CC BY 3.0), https://thenounproject.com/icon/2676113/ : outline filled and recolored -->
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/light/main.css" />

    <link rel="stylesheet" href="css/style.css" />

    <!-- AMD build of the SDK: provides the global `require` used by js/map.js and js/location.js -->
    <script src="https://js.arcgis.com/4.30/"></script>
</head>
<body>

    <header class="app-header" id="appHeader">
        <div class="header-text">
            <div id="lbl-title" class="header-title">ForeignHokkaido</div>
            <div id="lbl-subtitle" class="header-subtitle">Oshima &amp; Hiyama Network Map for ALTs</div>
        </div>
        <div class="header-controls">
            <button type="button" id="btn-tour" class="header-btn">❓ App Tour</button>
            <button type="button" id="btn-lang-toggle" class="header-btn primary">🇯🇵 日本語</button>
            <button type="button" id="btn-season-toggle" class="header-btn">❄️ Winter Mode</button>
            <button type="button" id="btn-reset-view" class="header-btn">🎯 Reset Extent</button>
        </div>
    </header>

    <div id="viewDiv"></div>

    <!-- Loaded as a module: serve this folder over http(s); file:// will not work. -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
